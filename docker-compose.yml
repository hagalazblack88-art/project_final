services:
  backend:
    build:
      context: ./livej_fastapi
      dockerfile: Dockerfile
    container_name: livej_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/db.sqlite3}
      - SECRET_KEY=${SECRET_KEY}
    volumes:
      - db_data:/app/data
    # Используем sh, так как он точно есть в python-slim
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: livej_frontend
    ports:
      - "80:80"
    depends_on:
      - backend  # Просто ждём запуска бэкенда, без сложных проверок
    restart: unless-stopped

volumes:
  db_data:
    driver: local